<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Ascenda</title>
    <meta name="description" content="Ascenda — um jogo de plataforma vertical de pulo carregado em pixel art." />
    <meta name="theme-color" content="#120e1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ascenda" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120e1c;
        /* bloqueia zoom, rolagem, seleção e o menu de toque longo */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: none;
      }
      #game {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        outline: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #safe-area-probe {
        position: fixed;
        left: 0;
        top: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #boot-error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #f4f1e8;
        font: 16px monospace;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Ascenda — jogo"></canvas>
    <div id="safe-area-probe"></div>
    <div id="boot-error">Não foi possível iniciar o jogo neste navegador.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
